<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRING</title><link rel="stylesheet" href="sidepanel.css"></head>
<body><header class="app-header"><div><div class="eyebrow">STRING</div><h1>Reasoning Graph Audit</h1><p>Analyze selected natural-language reasoning.</p></div><button id="options" class="icon-button" title="Settings" aria-label="Settings">⚙</button></header>
<main>
<section class="card"><div class="section-heading"><div><span class="step">1</span><h2>Input text</h2></div><span class="hint">Web selection or pasted text</span></div><label class="sr-only" for="textInput">Input text</label><textarea id="textInput" placeholder="Select text on a webpage or paste text here."></textarea><div class="input-actions"><button id="paste" class="text-action" type="button">Paste</button><button id="copy" class="text-action" type="button">Copy</button></div></section>
<details class="settings-panel"><summary>Analysis settings <span class="chevron">⌄</span></summary><div class="settings-grid"><label>Model<select id="model"><option value="gpt-5.6">gpt-5.6</option><option value="gpt-5.4-mini">gpt-5.4-mini</option><option value="gpt-5.4-nano">gpt-5.4-nano</option></select></label><label>Reasoning effort<select id="effort"><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select></label><label>Max output tokens<input id="tokens" type="number" min="256" max="100000" value="12000"></label><label class="full">Optional context<input id="contextInput" placeholder="Optional task or interpretation context"></label></div></details>
<button id="run" class="primary-action" type="button"><span>Analyze with STRING</span><span>→</span></button><div id="status" data-state="idle" role="status"></div>
<section id="result" class="result-card" hidden><div class="result-title"><span class="status-dot"></span><h2>Analysis result</h2></div><a id="open" class="secondary-action" href="#" target="_blank" hidden><span>Open graph report</span><span>↗</span></a><details class="debug-panel"><summary>Response JSON</summary><pre id="json"></pre></details></section>
</main><script src="sidepanel.js"></script></body></html>
