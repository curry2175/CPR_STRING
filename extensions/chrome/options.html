<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRING Settings</title><link rel="stylesheet" href="options.css"></head><body><main><header><div class="eyebrow">STRING</div><h1>Extension settings</h1><p>Configure the local STRING backend and default model settings.</p></header>
<section class="settings-section"><h2>Local backend</h2><p class="section-help">The extension never stores an API key; requests are sent to your local server.</p><div class="grid"><label>Analysis endpoint<input id="backendEndpoint" type="url"><span class="field-help">Default: /api/discussion-lab/run</span></label><label>Graph report page<input id="resultPage" type="url"><span class="field-help">Default: /discussion-lab</span></label></div></section>
<section class="settings-section"><h2>Model defaults</h2><div class="grid"><label>Model<input id="model"></label><label>Reasoning effort<select id="reasoning_effort"><option>low</option><option>medium</option><option>high</option></select></label><label>Max output tokens<input id="max_output_tokens" type="number" min="256" max="100000"></label><label>Timeout (ms)<input id="timeout" type="number" min="1000" max="600000"></label></div></section>
<section class="settings-section"><label class="check-label"><input id="floatingEnabled" type="checkbox"> Show a floating STRING button after selecting text</label></section><footer><button id="save" type="button">Save settings</button><span id="status"></span></footer></main><script src="options.js"></script></body></html>
