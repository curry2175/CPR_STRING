<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRG 자동 오류 주입 시험</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6fb;color:#172033}.wrap{max-width:1250px;margin:28px auto;padding:0 18px}.bar,.panel{background:white;border:1px solid #d9e0eb;border-radius:14px;padding:16px;margin-bottom:14px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #b9c4d5;background:white;padding:9px 12px;border-radius:9px;cursor:pointer;text-decoration:none;color:#172033}.primary{background:#2358d5;color:white}.grid{display:grid;grid-template-columns:430px 1fr;gap:14px}textarea{width:100%;min-height:590px;box-sizing:border-box;font-family:Consolas,monospace;font-size:12px;padding:12px;border:1px solid #ccd5e3;border-radius:10px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.metric{background:#f7f9fc;border:1px solid #e1e6ee;border-radius:10px;padding:10px}.metric small{display:block;color:#697386}.metric strong{font-size:20px}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th,td{border:1px solid #dfe5ed;padding:7px;text-align:left;vertical-align:top}th{background:#eef3fa}.ok{color:#147a43}.bad{color:#b42318}.msg{white-space:pre-wrap;color:#b42318}@media(max-width:950px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap"><div class="bar"><div><h1 style="margin:0">자동 오류 주입 시험 · v015</h1><p style="margin:5px 0 0;color:#687386">반대 주장·새 Predicate·Entity/argument 교체·잘못된 declared Parent를 주입해 Claim과 Chain 오류를 함께 측정합니다.</p></div><div class="controls"><a class="btn" href="/">Graph</a><a class="btn" href="/preflight">입력 사전점검</a><a class="btn" href="/ingest">Raw LLM</a><a class="btn" href="/dataset">Dataset</a><a class="btn" href="/quality">Reasoning 품질</a><a class="btn" href="/audit-verify">Audit Verify</a></div></div>
<div class="grid"><section class="panel"><div class="controls"><select id="sample"></select><button class="btn" id="load">샘플 불러오기</button><button class="btn primary" id="run">오류 주입 시험 실행</button><button class="btn" id="save">결과 저장</button></div><textarea id="input"></textarea><div id="error" class="msg"></div></section>
<section class="panel"><div class="metrics"><div class="metric"><small>대상 Node</small><strong id="eligible">-</strong></div><div class="metric"><small>전체 탐지율</small><strong id="overall">-</strong></div><div class="metric"><small>반대 주장 탐지</small><strong id="flip">-</strong></div><div class="metric"><small>새 Predicate 탐지</small><strong id="novel">-</strong></div><div class="metric"><small>원래 Chain 손상</small><strong id="locked">-</strong></div></div><div style="overflow:auto;max-height:650px"><table><thead><tr><th>Node</th><th>Mutation</th><th>변형 문장</th><th>Expected P/C</th><th>Observed P/C</th><th>성공</th><th>Final Chain</th><th>Parity</th><th>Mode</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></div>
<script>const $=id=>document.getElementById(id);let samples={},result=null;async function init(){samples=await fetch('/api/samples').then(r=>r.json());Object.keys(samples).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;$('sample').appendChild(o)});$('sample').value='sample_long_chain_incremental' in samples?'sample_long_chain_incremental':Object.keys(samples)[0];load()}function load(){$('input').value=JSON.stringify(samples[$('sample').value]||{},null,2)}async function run(){try{$('error').textContent='';const c=JSON.parse($('input').value);const r=await fetch('/api/mutation-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:c,prefer_z3:true,max_nodes:20})});const b=await r.json();if(!r.ok)throw new Error(b.detail||r.status);result=b;render()}catch(e){$('error').textContent=e.message}}function render(){const s=result.summary;$('eligible').textContent=s.eligible_reasoning_nodes;$('overall').textContent=p(s.overall_detection_percent);$('flip').textContent=p(s.polarity_flip_detection_percent);$('novel').textContent=p(s.novel_predicate_detection_percent);$('locked').textContent=s.final_chain_blocked_or_invalid_count+'/'+s.mutation_count;$('rows').innerHTML=result.mutations.map(x=>`<tr><td>${e(x.node_id)}</td><td>${e(x.mutation_type)}</td><td>${e(x.mutated_text)}</td><td>${e(x.expected_proof_status)} / ${e(x.expected_chain_status||'-')}</td><td>${e(x.observed_proof_status)} / ${e(x.observed_chain_status)}</td><td class="${x.detected_as_expected?'ok':'bad'}">${x.detected_as_expected?'PASS':'FAIL'}</td><td>${e(x.final_chain_status)}</td><td>${x.parity_match}</td><td>${e(x.revalidation_mode)}</td></tr>`).join('')}function p(x){return x==null?'-':`${x}%`}function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('load').onclick=load;$('run').onclick=run;$('save').onclick=()=>{if(!result)return;const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=`${result.case_id}_mutation_test.json`;a.click();URL.revokeObjectURL(u)};init();</script></body></html>
