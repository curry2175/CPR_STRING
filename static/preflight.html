<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRG 입력 사전점검</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6fb;color:#172033}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.bar,.panel{background:white;border:1px solid #d9e0eb;border-radius:14px;padding:16px;margin-bottom:14px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #b9c4d5;background:white;padding:9px 12px;border-radius:9px;cursor:pointer;text-decoration:none;color:#172033}.primary{background:#2358d5;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}textarea{width:100%;min-height:560px;box-sizing:border-box;font-family:Consolas,monospace;font-size:12px;padding:12px;border:1px solid #ccd5e3;border-radius:10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#f7f9fc;border:1px solid #e1e6ee;border-radius:10px;padding:10px}.metric small{display:block;color:#697386}.metric strong{font-size:21px}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}th,td{border:1px solid #dfe5ed;padding:7px;text-align:left;vertical-align:top}th{background:#eef3fa}.ok{color:#147a43}.bad{color:#b42318}.msg{white-space:pre-wrap;color:#b42318}@media(max-width:900px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap"><div class="bar"><div><h1 style="margin:0">입력 사전점검 · v015</h1><p style="margin:5px 0 0;color:#687386">Z3 실행 전에 문장별 Parser 변환, Semantic 정규화, ID/Yes-No 형식을 확인합니다.</p></div><div class="controls"><a class="btn" href="/">Graph</a><a class="btn" href="/quality">Reasoning 품질</a><a class="btn" href="/mutation">오류 주입 시험</a><a class="btn" href="/ingest">Raw LLM</a><a class="btn" href="/dataset">Dataset</a><a class="btn" href="/audit-verify">Audit Verify</a></div></div>
<div class="grid"><section class="panel"><div class="controls"><select id="sample"></select><button class="btn" id="load">샘플 불러오기</button><button class="btn primary" id="run">사전점검 실행</button><button class="btn" id="save">결과 JSON 저장</button></div><textarea id="input"></textarea><div id="error" class="msg"></div></section>
<section class="panel"><div class="metrics"><div class="metric"><small>검증 준비</small><strong id="ready">-</strong></div><div class="metric"><small>Parser coverage</small><strong id="coverage">-</strong></div><div class="metric"><small>Error / warning</small><strong id="counts">-</strong></div></div><h3>오류와 경고</h3><pre id="messages">-</pre><h3>문장별 변환</h3><div style="overflow:auto;max-height:560px"><table><thead><tr><th>ID</th><th>종류</th><th>상태</th><th>원문</th><th>정규화 논리식</th><th>Declared Parent</th><th>오류</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></div>
<script>const $=id=>document.getElementById(id);let samples={},result=null;async function init(){samples=await fetch('/api/samples').then(r=>r.json());Object.keys(samples).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;$('sample').appendChild(o)});load()}function load(){$('input').value=JSON.stringify(samples[$('sample').value]||{},null,2)}async function run(){try{const c=JSON.parse($('input').value);const r=await fetch('/api/preflight',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:c})});const b=await r.json();if(!r.ok)throw new Error(b.detail||r.status);result=b;render()}catch(e){$('error').textContent=e.message}}function render(){$('error').textContent='';$('ready').textContent=result.ready_for_verification?'YES':'NO';$('ready').className=result.ready_for_verification?'ok':'bad';$('coverage').textContent=`${result.summary.parser_coverage_percent}%`;$('counts').textContent=`${result.summary.error_count} / ${result.summary.warning_count}`;$('messages').textContent=[...result.errors.map(x=>'ERROR: '+x),...result.warnings.map(x=>'WARN: '+x)].join('\n')||'없음';const all=[...result.statements,result.question];$('rows').innerHTML=all.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.kind)}</td><td class="${x.parse_status==='parseable'?'ok':'bad'}">${esc(x.parse_status)}</td><td>${esc(x.text)}</td><td>${esc(x.normalized_formal||'-')}</td><td>${esc((x.declared_dependencies||[]).join(', ')||'-')}</td><td>${esc(x.error||'-')}</td></tr>`).join('')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('load').onclick=load;$('run').onclick=run;$('save').onclick=()=>{if(!result)return;const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=`${result.case_id}_preflight.json`;a.click();URL.revokeObjectURL(u)};init();</script></body></html>
