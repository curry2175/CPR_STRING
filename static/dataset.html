<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dataset Bridge · VRG v015</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1350px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;gap:12px}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cfd7e6;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;text-decoration:none;color:#172033}.primary{background:#275efe;color:white}.panel{background:#fff;border:1px solid #d8deea;border-radius:12px;padding:15px;margin-top:14px}textarea{width:100%;box-sizing:border-box;min-height:360px;font-family:Consolas,monospace;font-size:12px;border:1px solid #cfd7e6;border-radius:9px;padding:10px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:14px}.metric{background:#fff;border:1px solid #d8deea;border-radius:10px;padding:10px}.metric small{display:block;color:#687386}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.json{min-height:360px}.error{color:#b42318;white-space:pre-wrap}.note{color:#667085;font-size:13px}@media(max-width:1000px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap">
<div class="bar"><div><h1 style="margin:0">Dataset / LLM Output Bridge · v015</h1><p class="note">Native Case, context/theory text, triples+rules 형태를 공통 Case JSON으로 바꾸고 Parser coverage와 Verifier 지표를 함께 계산합니다.</p></div><div class="controls"><a class="btn" href="/">Graph</a><a class="btn" href="/ingest">Raw LLM 변환</a><a class="btn" href="/audit-verify">감사 ZIP 검증</a></div></div>
<div class="metrics"><div class="metric"><small>입력</small><strong id="mInput">-</strong></div><div class="metric"><small>변환 성공</small><strong id="mAdapted">-</strong></div><div class="metric"><small>Parser coverage</small><strong id="mCoverage">-</strong></div><div class="metric"><small>Answer accuracy</small><strong id="mAccuracy">-</strong></div><div class="metric"><small>Final Chain valid</small><strong id="mChain">-</strong></div><div class="metric"><small>맞는 답·틀린 풀이</small><strong id="mBadReasoning">-</strong></div></div>
<section class="panel"><div class="controls"><button class="btn" id="sample">내장 혼합 JSONL</button><button class="btn" id="adapt">형식 변환만</button><button class="btn primary" id="evaluate">변환 + 전체 평가</button><label class="btn"><input id="z3" type="checkbox" checked>Z3 우선</label><a class="btn" href="/api/dataset-evaluation-latest">결과 JSON</a><a class="btn" href="/api/dataset-cases-csv">Case CSV</a><a class="btn" href="/api/dataset-report" target="_blank">HTML Report</a><a class="btn" href="/api/adapted-cases-jsonl">변환 JSONL</a></div><textarea id="jsonl" placeholder="한 줄에 JSON object 하나"></textarea><div id="error" class="error"></div></section>
<div class="grid"><section class="panel"><h2>요약</h2><textarea id="summary" class="json" readonly></textarea></section><section class="panel"><h2>Case별 결과</h2><textarea id="rows" class="json" readonly></textarea></section></div></div>
<script>const $=id=>document.getElementById(id);function show(data){$('summary').value=JSON.stringify(data.research_summary||data.summary,null,2);$('rows').value=JSON.stringify(data.rows||[],null,2);const s=data.research_summary||data.summary||{};$('mInput').textContent=s.input_records??s.total_records??'-';$('mAdapted').textContent=s.adapted_records??'-';$('mCoverage').textContent=(s.average_parser_coverage_percent??'-')+(s.average_parser_coverage_percent!=null?'%':'');$('mAccuracy').textContent=(s.answer_accuracy_percent??'-')+(s.answer_accuracy_percent!=null?'%':'');$('mChain').textContent=(s.final_chain_valid_percent??'-')+(s.final_chain_valid_percent!=null?'%':'');$('mBadReasoning').textContent=(s.valid_answer_but_invalid_reasoning_percent??'-')+(s.valid_answer_but_invalid_reasoning_percent!=null?'%':'')}
async function call(path){try{$('error').textContent='';const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonl:$('jsonl').value,prefer_z3:$('z3').checked})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'실행 실패');show(d)}catch(e){$('error').textContent=e.message}}
$('sample').onclick=async()=>{$('jsonl').value=await (await fetch('/api/dataset-sample')).text()};$('adapt').onclick=()=>call('/api/dataset-adapt');$('evaluate').onclick=()=>call('/api/dataset-evaluate');</script></body></html>
