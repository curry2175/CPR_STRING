<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRG Reasoning 품질 분석</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6fb;color:#172033}.wrap{max-width:1450px;margin:26px auto;padding:0 18px}.bar,.panel{background:#fff;border:1px solid #d9e0eb;border-radius:14px;padding:16px;margin-bottom:14px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #b9c4d5;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;text-decoration:none;color:#172033}.primary{background:#2358d5;color:#fff}.grid{display:grid;grid-template-columns:430px 1fr;gap:14px}textarea{width:100%;min-height:660px;box-sizing:border-box;font-family:Consolas,monospace;font-size:12px;padding:12px;border:1px solid #ccd5e3;border-radius:10px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.metric{background:#f7f9fc;border:1px solid #e1e6ee;border-radius:10px;padding:10px}.metric small{display:block;color:#697386}.metric strong{font-size:20px}.note{font-size:12px;color:#687386;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th,td{border:1px solid #dfe5ed;padding:7px;text-align:left;vertical-align:top}th{background:#eef3fa}.bad{color:#b42318;font-weight:700}.warn{color:#9a6700;font-weight:700}.ok{color:#147a43;font-weight:700}.msg{white-space:pre-wrap;color:#b42318}@media(max-width:1000px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap"><div class="bar"><div><h1 style="margin:0">Premise 기반 AI Reasoning 품질 분석 · v015</h1><p style="margin:5px 0 0;color:#687386">Step 자체의 진위뿐 아니라, 지정 Parent의 충분성·경로 모호성·최소 Proof·필수성·원자성을 함께 봅니다.</p></div><div class="controls"><a class="btn" href="/">Graph</a><a class="btn" href="/preflight">사전점검</a><a class="btn" href="/mutation">오류 주입</a><a class="btn" href="/batch">Batch</a></div></div>
<div class="grid"><section class="panel"><div class="controls"><select id="sample"></select><button class="btn" id="load">샘플 불러오기</button><button class="btn primary" id="run">Reasoning 분석</button><button class="btn" id="save">결과 JSON 저장</button></div><textarea id="input"></textarea><div id="error" class="msg"></div></section>
<section class="panel"><div class="metrics"><div class="metric"><small>Integrity score</small><strong id="score">-</strong></div><div class="metric"><small>Proof valid</small><strong id="proof">-</strong></div><div class="metric"><small>Chain valid</small><strong id="chain">-</strong></div><div class="metric"><small>모호한 Parent</small><strong id="amb">-</strong></div><div class="metric"><small>불충분 declared path</small><strong id="insuf">-</strong></div></div><div id="formula" class="note"></div><div style="overflow:auto;max-height:680px"><table><thead><tr><th>Node</th><th>문장</th><th>P / C</th><th>Role / Error</th><th>Local support</th><th>Dependency confidence</th><th>후보 경로 수</th><th>최소 Proof</th><th>Final 필수성</th><th>원자성</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></div>
<script>const $=id=>document.getElementById(id);let samples={},result=null;async function init(){samples=await fetch('/api/samples').then(r=>r.json());Object.keys(samples).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;$('sample').appendChild(o)});$('sample').value=samples.sample_declared_insufficient?'sample_declared_insufficient':Object.keys(samples)[0];load()}function load(){$('input').value=JSON.stringify(samples[$('sample').value]||{},null,2)}async function run(){try{$('error').textContent='';const c=JSON.parse($('input').value);const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:c,prefer_z3:true,compute_counterfactuals:false})});const b=await r.json();if(!r.ok)throw new Error(b.detail||r.status);result=b;render()}catch(e){$('error').textContent=e.message}}function cls(v){if(['contradiction','ungrounded','untranslatable','blocked_by_upstream_error','insufficient_declared_support','no_support'].includes(v))return'bad';if(['inferred_ambiguous','compound','possibly_compound','declared_but_insufficient'].includes(v))return'warn';return'ok'}function render(){const q=result.reasoning_quality_profile||{},s=result.summary||{};$('score').textContent=q.reasoning_integrity_score==null?'-':q.reasoning_integrity_score;$('proof').textContent=p(q.proof_valid_percent);$('chain').textContent=p(q.chain_valid_percent);$('amb').textContent=s.ambiguous_dependency_step_count??'-';$('insuf').textContent=s.insufficient_declared_support_count??'-';$('formula').textContent=q.score_formula||'';const nodes=(result.nodes||[]).filter(n=>n.kind==='reasoning'||n.kind==='answer');$('rows').innerHTML=nodes.map(n=>`<tr><td>${e(n.id)}</td><td>${e(n.text)}</td><td><span class="${cls(n.proof_status)}">${e(n.proof_status)}</span><br><span class="${cls(n.chain_status)}">${e(n.chain_status)}</span></td><td>${e(n.reasoning_role||'-')}<br>${e(n.reasoning_error_type||'-')}</td><td class="${cls(n.local_support_status)}">${e(n.local_support_status||'-')}</td><td class="${cls(n.dependency_confidence)}">${e(n.dependency_confidence||'-')}</td><td>${e(n.dependency_candidate_count??'-')}</td><td>${e((n.minimal_proof_paths||[]).map(x=>x.join('+')).join(' | ')||'-')}</td><td>${e(n.final_proof_necessity||'-')}</td><td class="${cls(n.atomicity_status)}">${e(n.atomicity_status||'-')} ${n.atomic_claim_count_estimate?`(${n.atomic_claim_count_estimate})`:''}</td></tr>`).join('')}function p(x){return x==null?'-':`${x}%`}function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('load').onclick=load;$('run').onclick=run;$('save').onclick=()=>{if(!result)return;const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=`${result.case_id}_reasoning_quality.json`;a.click();URL.revokeObjectURL(u)};init();</script></body></html>
