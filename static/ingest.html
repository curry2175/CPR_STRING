<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raw LLM Ingest · VRG v015</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cfd7e6;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;text-decoration:none;color:#172033}.primary{background:#275efe;color:white;border-color:#275efe}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{background:white;border:1px solid #d8deea;border-radius:12px;padding:16px}label{display:block;font-size:13px;color:#647084;margin:12px 0 5px}textarea,input{width:100%;box-sizing:border-box;border:1px solid #cfd7e6;border-radius:9px;padding:9px}textarea{min-height:110px;resize:vertical}.response{min-height:260px}.json{min-height:540px;font-family:Consolas,monospace;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.metric{background:white;border:1px solid #d8deea;border-radius:10px;padding:10px}.metric small{display:block;color:#6c7688}.error{color:#b42318;white-space:pre-wrap}.note{color:#667085;font-size:13px}</style></head><body><div class="wrap">
<div class="bar"><div><h1 style="margin:0">Raw LLM Output → Case 변환 · v015</h1><p class="note">Premise와 LLM 원문 답변을 붙여 넣으면 reasoning Step과 Yes/No를 추출하고 즉시 Parser 사전점검을 수행합니다.</p></div><div class="controls"><a class="btn" href="/">Graph</a><a class="btn" href="/dataset">Dataset</a><a class="btn" href="/audit-verify">감사 ZIP 검증</a></div></div>
<div class="metrics"><div class="metric"><small>추출 방식</small><strong id="mStrategy">-</strong></div><div class="metric"><small>Reasoning Step</small><strong id="mSteps">-</strong></div><div class="metric"><small>추출된 답</small><strong id="mAnswer">-</strong></div><div class="metric"><small>Parser coverage</small><strong id="mCoverage">-</strong></div></div>
<div class="grid"><section class="panel"><div class="controls"><button class="btn" id="sample">샘플 불러오기</button><button class="btn primary" id="run">변환 및 사전점검</button><button class="btn" id="download">Case JSON 저장</button></div>
<label>Case ID</label><input id="caseId" value="imported_case"><label>Premises · 한 줄에 한 문장</label><textarea id="premises"></textarea><label>Question</label><input id="question"><label>Gold answer · Yes/No</label><input id="gold"><label>Predicted answer · 비워두면 응답에서 추출</label><input id="predicted"><label>LLM 원문 응답</label><textarea id="response" class="response"></textarea><div id="error" class="error"></div></section>
<section class="panel"><h2 style="margin-top:0">변환 결과</h2><textarea id="result" class="json" readonly></textarea></section></div></div>
<script>
let latest=null;const $=id=>document.getElementById(id);
function payload(){return{case_id:$('caseId').value,premises:$('premises').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),question:$('question').value,gold_answer:$('gold').value,predicted_answer:$('predicted').value||undefined,llm_response:$('response').value}}
async function run(){try{$('error').textContent='';const r=await fetch('/api/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});const data=await r.json();if(!r.ok)throw new Error(data.detail||'변환 실패');latest=data;$('result').value=JSON.stringify(data,null,2);$('mStrategy').textContent=data.extraction.strategy;$('mSteps').textContent=data.extraction.step_count;$('mAnswer').textContent=data.case.llm_output.answer;$('mCoverage').textContent=data.preflight.summary.parser_coverage_percent+'%'}catch(e){$('error').textContent=e.message}}
$('sample').onclick=async()=>{const d=await (await fetch('/api/raw-ingest-sample')).json();$('caseId').value=d.case_id;$('premises').value=d.premises.join('\n');$('question').value=d.question;$('gold').value=d.gold_answer;$('response').value=d.llm_response;$('predicted').value=''};
$('run').onclick=run;$('download').onclick=()=>{if(!latest)return;const blob=new Blob([JSON.stringify(latest.case,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(latest.case.id||'ingested_case')+'.json';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
