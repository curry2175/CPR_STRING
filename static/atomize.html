<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRG Step 원자화</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6fb;color:#172033}.wrap{max-width:1400px;margin:26px auto;padding:0 18px}.bar,.panel{background:#fff;border:1px solid #d9e0eb;border-radius:14px;padding:16px;margin-bottom:14px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #b9c4d5;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;text-decoration:none;color:#172033}.primary{background:#2358d5;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}textarea{width:100%;min-height:620px;box-sizing:border-box;font-family:Consolas,monospace;font-size:12px;padding:12px;border:1px solid #ccd5e3;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th,td{border:1px solid #dfe5ed;padding:7px;text-align:left;vertical-align:top}th{background:#eef3fa}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#f7f9fc;border:1px solid #e1e6ee;border-radius:10px;padding:10px}.metric small{display:block;color:#697386}.metric strong{font-size:20px}.bad{color:#b42318;font-weight:700}.ok{color:#147a43;font-weight:700}.msg{white-space:pre-wrap;color:#b42318}@media(max-width:980px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap"><div class="bar"><div><h1 style="margin:0">Compound Reasoning Step 원자화 · v015</h1><p style="margin:5px 0 0;color:#687386">명시적인 문장 경계만 보수적으로 분리하며, 모든 조각이 Parser에서 번역될 때만 자동 적용합니다.</p></div><div class="controls"><a class="btn" href="/">Graph</a><a class="btn" href="/quality">Quality</a><a class="btn" href="/evaluation">Gold 평가</a></div></div>
<div class="grid"><section class="panel"><div class="controls"><select id="sample"></select><button class="btn" id="load">샘플 불러오기</button><button class="btn primary" id="run">원자화 미리보기 + 적용</button><button class="btn" id="save">Atomized Case 저장</button></div><textarea id="input"></textarea><div id="error" class="msg"></div></section>
<section class="panel"><div class="metrics"><div class="metric"><small>원래 Step</small><strong id="orig">-</strong></div><div class="metric"><small>원자화 후 Step</small><strong id="after">-</strong></div><div class="metric"><small>분리된 Compound</small><strong id="split">-</strong></div><div class="metric"><small>수동 검토</small><strong id="manual">-</strong></div></div><table><thead><tr><th>원래 Step</th><th>상태</th><th>생성 ID</th><th>분리된 문장</th></tr></thead><tbody id="rows"></tbody></table><h3>적용된 Case JSON</h3><textarea id="output" readonly></textarea></section></div></div>
<script>const $=id=>document.getElementById(id);let samples={},result=null;async function init(){samples=await fetch('/api/samples').then(r=>r.json());Object.keys(samples).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;$('sample').appendChild(o)});$('sample').value=samples.sample_compound_reasoning?'sample_compound_reasoning':Object.keys(samples)[0];load()}function load(){$('input').value=JSON.stringify(samples[$('sample').value]||{},null,2)}async function run(){try{$('error').textContent='';const c=JSON.parse($('input').value);const r=await fetch('/api/atomize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:c,apply:true})});const b=await r.json();if(!r.ok)throw new Error(b.detail||r.status);result=b;render()}catch(e){$('error').textContent=e.message}}function render(){const s=result.summary||{};$('orig').textContent=s.original_step_count??'-';$('after').textContent=s.atomized_step_count??'-';$('split').textContent=s.compound_steps_split??'-';$('manual').textContent=s.manual_review_required_count??'-';$('rows').innerHTML=(result.mappings||[]).map(x=>`<tr><td>${e(x.origin_step_id)}</td><td class="${x.status==='manual_review_required'?'bad':'ok'}">${e(x.status)}</td><td>${e((x.new_step_ids||[]).join(', '))}</td><td>${e((x.parts||[]).join(' | '))}</td></tr>`).join('');$('output').value=JSON.stringify(result.atomized_case||{},null,2)}function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('load').onclick=load;$('run').onclick=run;$('save').onclick=()=>{if(!result)return;const u=URL.createObjectURL(new Blob([JSON.stringify(result.atomized_case,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=`${result.case_id}_atomized_case.json`;a.click();URL.revokeObjectURL(u)};init();</script></body></html>
