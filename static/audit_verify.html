<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Package Verification · VRG v015</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1150px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cfd7e6;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;text-decoration:none;color:#172033}.primary{background:#275efe;color:white}.panel{background:#fff;border:1px solid #d8deea;border-radius:12px;padding:16px;margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.metric{background:#fff;border:1px solid #d8deea;border-radius:10px;padding:10px}.metric small{display:block;color:#687386}textarea{width:100%;box-sizing:border-box;min-height:500px;font-family:Consolas,monospace;font-size:12px;border:1px solid #d8deea;border-radius:9px;padding:10px}.error{color:#b42318}.note{color:#667085;font-size:13px}</style></head><body><div class="wrap">
<div class="bar"><div><h1 style="margin:0">감사 패키지 무결성·SMT 재실행 · v015</h1><p class="note">manifest SHA-256, 필수 파일, Graph metadata를 확인하고 Z3가 있으면 각 SMT2를 다시 실행해 원래 SAT/UNSAT과 비교합니다.</p></div><div class="controls"><a class="btn" href="/">Graph</a><a class="btn" href="/dataset">Dataset</a><a class="btn" href="/ingest">Raw LLM 변환</a></div></div>
<div class="metrics"><div class="metric"><small>Integrity</small><strong id="mIntegrity">-</strong></div><div class="metric"><small>Full replay</small><strong id="mReplay">-</strong></div><div class="metric"><small>Hash</small><strong id="mHash">-</strong></div><div class="metric"><small>Metadata</small><strong id="mMeta">-</strong></div><div class="metric"><small>SMT replay</small><strong id="mSmt">-</strong></div></div>
<section class="panel"><div class="controls"><input id="file" type="file" accept=".zip,application/zip"><label class="btn"><input id="rerun" type="checkbox" checked>SMT2 재실행</label><button class="btn primary" id="verify">ZIP 검증</button><button class="btn" id="download">결과 JSON 저장</button></div><p id="error" class="error"></p><textarea id="result" readonly></textarea></section></div>
<script>let latest=null;const $=id=>document.getElementById(id);$('verify').onclick=async()=>{try{$('error').textContent='';const f=$('file').files[0];if(!f)throw new Error('ZIP 파일을 선택하세요.');const r=await fetch('/api/audit-verify?rerun_smt='+$('rerun').checked,{method:'POST',headers:{'Content-Type':'application/zip'},body:await f.arrayBuffer()});const d=await r.json();if(!r.ok)throw new Error(d.detail||'검증 실패');latest=d;$('result').value=JSON.stringify(d,null,2);const s=d.summary;$('mIntegrity').textContent=s.integrity_pass?'PASS':'FAIL';$('mReplay').textContent=s.full_replay_pass===true?'PASS':(s.full_replay_pass===false?'FAIL':'NOT RUN');$('mHash').textContent=s.hash_match_count+'/'+s.hash_check_count;$('mMeta').textContent=s.metadata_match_count+'/'+s.metadata_check_count;$('mSmt').textContent=s.smt_replay_available?s.smt_replay_match_count+'/'+s.smt_replay_check_count:'Z3 unavailable'}catch(e){$('error').textContent=e.message}};$('download').onclick=()=>{if(!latest)return;const b=new Blob([JSON.stringify(latest,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='audit_verification.json';a.click();URL.revokeObjectURL(a.href)};</script></body></html>
